name: Deploy Strapi Portal

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image name
        id: meta
        run: |
          IMAGE="${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PUBLIC_URL=https://api-hotel.qenenia.com

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STRAPI_IMAGE: ${{ needs.build.outputs.image }}:${{ github.sha }}
          VERIFY_ET_API_KEY: ${{ secrets.VERIFY_ET_API_KEY }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          envs: GHCR_TOKEN,STRAPI_IMAGE,VERIFY_ET_API_KEY
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
            cd /var/www/hotel-api/hotel-strapi-backend
            git pull origin main

            # 1) Database backup — best-effort. Warns if it fails, but does NOT
            #    block the deploy (so migrations still go through).
            mkdir -p ~/backups
            BACKUP=~/backups/hotel-$(date +%F-%H%M).sql

            # Auto-detect the DB service name (works with strapi-db, db, postgres, etc.)
            DB_SERVICE=$(docker compose config --services 2>/dev/null | grep -Ei 'db|postgres|database' | head -1)
            echo "DB service detected: ${DB_SERVICE:-<none>}"

            if [ -n "$DB_SERVICE" ]; then
              docker compose exec -T "$DB_SERVICE" sh -c 'pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"' > "$BACKUP" 2>/dev/null || true
              if [ -s "$BACKUP" ]; then
                echo "✅ Backup OK: $(ls -lh "$BACKUP")"
              else
                echo "⚠️  Backup failed or empty — continuing anyway (non-blocking)"
                rm -f "$BACKUP"
              fi
            else
              echo "⚠️  Could not detect DB service — skipping backup"
            fi

            # 2) Write Verify.ET settings into the server .env
            [ -n "$(tail -c1 .env)" ] && echo >> .env
            if [ -n "$VERIFY_ET_API_KEY" ]; then
              sed -i "/^VERIFY_ET_API_KEY=/d" .env
              echo "VERIFY_ET_API_KEY=$VERIFY_ET_API_KEY" >> .env
            fi
            for kv in "VERIFY_ET_AUTO_APPROVE=false" "VERIFY_ET_REQUIRE_RECEIVER_MATCH=true"; do
              k="${kv%%=*}"
              grep -q "^$k=" .env || echo "$kv" >> .env
            done

            export STRAPI_IMAGE
            docker compose pull
            docker compose up -d
            docker image prune -f
