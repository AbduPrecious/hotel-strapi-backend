services:
  strapi-db:
    image: postgres:16-alpine
    container_name: hotel-db
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - strapi-data:/var/lib/postgresql/data
    networks:
      - hotel-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  strapi:
    image: ${STRAPI_IMAGE:-ghcr.io/abduprecious/hotel-strapi-backend:latest}
    build: .
    container_name: hotel-app
    restart: always
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1337
      DATABASE_HOST: strapi-db
      STRAPI_ADMIN_BACKEND_URL: ${PUBLIC_URL}
      STRAPI_URL: ${PUBLIC_URL}
    volumes:
      - ./public/uploads:/opt/app/public/uploads
    ports:
      - "127.0.0.1:3008:1337"
    networks:
      - hotel-net
    depends_on:
      strapi-db:
        condition: service_healthy

networks:
  hotel-net:

volumes:
  strapi-data:
